<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ehdude ~ Dashboard</title>
  <script>
    (() => {
      try {
        const savedTheme = localStorage.getItem("dashboard-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <button class="theme-toggle" type="button" id="themeToggle" aria-label="Switch theme">☾</button>

  <main class="stage" aria-label="Dashboard navigation">
    <div class="top-bar" aria-label="Main shortcuts">
      <button class="dock-btn folder-btn" type="button" aria-label="File Explorer">
        <img class="dock-icon folder-icon" src="folder-svgrepo-com.svg" alt="" aria-hidden="true" />
        <div class="active_line"></div>
      </button>

      <button class="dock-btn start-btn" type="button" aria-label="Start Menu" id="startBtn" aria-expanded="false" aria-controls="startMenu">
        <img class="dock-icon home-icon" src="home-icon.png" alt="" aria-hidden="true" />
        <div class="active_line"></div>
      </button>

      <button class="debian-shortcut" type="button" aria-label="Debian">
        <img class="debian-stroke" src="debian-stroke.png" alt="" aria-hidden="true" />
        <div class="debian-active-line"></div>
      </button>

      <button class="scrobble-toggle" type="button" id="scrobbleToggle" aria-label="Open listening widget" aria-expanded="false" aria-controls="scrobblePanel">
        <img class="scrobble-icon" src="lastfm-svgrepo-com.svg" alt="" aria-hidden="true" />
        <div class="scrobble-active-line"></div>
      </button>
    </div>

    <section class="start-menu hidden" id="startMenu" aria-label="Floating start menu dashboard">
      <div class="search-bar">
        <div class="search-bar-inner">
          <div class="search-icon" aria-hidden="true">
            <svg viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg">
              <circle cx="5.5" cy="5.5" r="4"/>
              <line x1="8.5" y1="8.5" x2="12" y2="12"/>
            </svg>
          </div>
          <input type="text" placeholder="Search for wot?" />
        </div>
      </div>

      <div class="content">
        <div class="pinned-header">
          <strong>Pinned</strong>
          <span class="show-all">Show all apps →</span>
        </div>
        <div class="apps-grid" id="appsGrid"></div>
      </div>

      <footer class="footer">
        <div class="user">
          <div class="user-avatar">🪳</div>
          <div class="user-text">
            <strong>eh dude</strong><br />
            <small>guns.lol/ehdude</small>
          </div>
        </div>
        <a class="ping-link" href="https://ping.ehdude.com" aria-label="Open ping">
          <div class="power-btn" aria-hidden="true">🎔</div>
        </a>
      </footer>
    </section>

    <aside class="scrobble-panel hidden" id="scrobblePanel" aria-label="Listening widget">
      <div class="scrobble-panel-bar">
        <button class="scrobble-close" type="button" id="scrobbleClose" aria-label="Close listening widget">×</button>
      </div>
      <iframe class="scrobble-frame" id="scrobbleFrame" title="Last.fm widget" loading="lazy"></iframe>
    </aside>
  </main>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
