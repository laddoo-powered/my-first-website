<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000c1f" />

  <title>ehdude ~ Dashboard</title>

  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/png" href="/assets/icons/favicon-96.png" sizes="96x96" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" sizes="180x180" />
  <link rel="manifest" href="/site.webmanifest" />

  <script>
    (() => {
      try {
        const theme = localStorage.getItem("dashboard-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    })();
  </script>

  <link rel="stylesheet" href="/assets/css/main.css" />
</head>
<body>
  <button class="theme-toggle" type="button" id="themeToggle" aria-label="Switch theme">☾</button>

  <main class="stage" aria-label="Dashboard navigation">
    <nav class="dock" aria-label="Main shortcuts">
      <button class="dock-button" type="button" aria-label="File Explorer">
        <img class="dock-icon dock-icon--folder" src="/assets/icons/folder.svg" alt="" aria-hidden="true" />
        <span class="dock-indicator" aria-hidden="true"></span>
      </button>

      <button class="dock-button" type="button" id="startBtn" aria-label="Start Menu" aria-expanded="false" aria-controls="startMenu">
        <img class="dock-icon dock-icon--home" src="/assets/icons/home.png" alt="" aria-hidden="true" />
        <span class="dock-indicator dock-indicator--home" aria-hidden="true"></span>
      </button>

      <button class="dock-button" type="button" aria-label="Debian">
        <img class="dock-icon dock-icon--debian" src="/assets/icons/debian.png" alt="" aria-hidden="true" />
        <span class="dock-indicator dock-indicator--debian" aria-hidden="true"></span>
      </button>
    </nav>

    <section class="start-menu hidden" id="startMenu" aria-label="Floating start menu dashboard">
      <div class="search-bar">
        <label class="search-field">
          <span class="search-icon" aria-hidden="true">
            <svg viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg">
              <circle cx="5.5" cy="5.5" r="4" />
              <line x1="8.5" y1="8.5" x2="12" y2="12" />
            </svg>
          </span>
          <span class="sr-only">Search</span>
          <input type="text" placeholder="Search for wot?" autocomplete="off" />
        </label>
      </div>

      <div class="menu-content">
        <div class="pinned-header">
          <strong>Pinned</strong>
          <span>Show all apps →</span>
        </div>

        <div class="apps-grid" id="appsGrid"></div>
      </div>

      <footer class="menu-footer">
        <div class="user-card">
          <div class="user-avatar" aria-hidden="true">🪳</div>
          <div class="user-copy">
            <strong>eh dude</strong>
            <small>guns.lol/ehdude</small>
          </div>
        </div>

        <a class="ping-link" href="https://ping.ehdude.com" aria-label="Open ping">
          <span aria-hidden="true">🎔</span>
        </a>
      </footer>
    </section>

    <aside class="scrobble-ticker hidden" id="scrobbleTicker" aria-live="polite" aria-label="Currently scrobbling">
      <iframe class="scrobble-frame" id="scrobbleFrame" title="Current Last.fm scrobble" loading="eager"></iframe>
    </aside>
  </main>

  <script type="module" src="/assets/js/main.js"></script>
</body>
</html>
